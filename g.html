<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name — Photo Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12100E;
    --surface:#1C1917;
    --text:#F5F1EA;
    --muted:#A79E8E;
    --gold:#D9A441;
    --line:#3A3530;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }

  /* ---------- feed ---------- */
  .feed{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{display:none;}

  .card{
    position:relative;
    height:100vh;
    width:100%;
    max-width:480px;
    margin:0 auto;
    scroll-snap-align:start;
    display:flex;
    align-items:flex-end;
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(18,16,14,0) 40%, rgba(18,16,14,0.85) 100%);
    pointer-events:none;
  }
  .card::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(18,16,14,0.35) 0%, rgba(18,16,14,0) 25%);
    pointer-events:none;
  }
  .card-clickable{
    position:absolute; inset:0;
    cursor:pointer;
    z-index:1;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    max-width:480px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 20px 0;
    z-index:20;
    pointer-events:none;
  }
  .wordmark{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:20px;
    letter-spacing:0.2px;
    text-shadow:0 1px 6px rgba(0,0,0,0.5);
  }
  .upload-btn{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(28,25,23,0.6);
    backdrop-filter:blur(6px);
    border:1px solid rgba(245,241,234,0.18);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 14px 8px 10px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .upload-btn:hover{
    background:rgba(217,164,65,0.18);
    border-color:var(--gold);
  }
  .upload-btn svg{width:16px; height:16px; flex-shrink:0;}

  /* ---------- content block (bottom-left) ---------- */
  .content{
    position:relative;
    z-index:2;
    padding:0 88px 34px 20px;
    width:100%;
  }
  .identity{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .avatar{
    width:36px; height:36px;
    border-radius:50%;
    background:var(--surface);
    border:1.5px solid var(--gold);
    flex-shrink:0;
    background-size:cover;
    background-position:center;
  }
  .handle{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
  }
  .role{
    font-size:12px;
    color:var(--muted);
  }
  .caption{
    font-size:14.5px;
    line-height:1.5;
    color:var(--text);
    margin-bottom:8px;
    max-width:340px;
  }
  .tags{
    font-size:13px;
    color:var(--gold);
  }

  /* ---------- side action rail ---------- */
  .rail{
    position:absolute;
    right:14px;
    bottom:100px;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .rail-btn{
    background:none;
    border:none;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    color:var(--text);
  }
  .rail-btn svg{
    width:26px; height:26px;
    stroke:var(--text);
    fill:none;
    stroke-width:1.6;
    transition:transform 0.15s ease, stroke 0.15s ease, fill 0.15s ease;
  }
  .rail-btn.liked svg{
    fill:var(--gold);
    stroke:var(--gold);
  }
  .rail-btn:active svg{ transform:scale(0.88); }
  .rail-btn.visit svg{ stroke:var(--gold); }
  .rail-btn.visit span{ color:var(--gold); font-weight:600; }

  /* ---------- position dots ---------- */
  .dots{
    position:fixed;
    top:50%;
    right:10px;
    transform:translateY(-50%);
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .dot{
    width:5px; height:5px;
    border-radius:50%;
    background:rgba(245,241,234,0.3);
    transition:background 0.2s ease, height 0.2s ease;
  }
  .dot.active{
    background:var(--gold);
    height:16px;
    border-radius:3px;
  }

  #file-input{ display:none; }

  @media (min-width: 481px){
    .feed{ border-left:1px solid var(--line); border-right:1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="wordmark">Your Name</span>
  <button class="upload-btn" id="upload-trigger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
    Upload photo
  </button>
</div>

<input type="file" id="file-input" accept="image/*">

<div class="dots" id="dots"></div>

<div class="feed" id="feed">
  <!-- Cards are generated by JS from the POSTS array below -->
</div>

<script>
/* ============================================================
   EDIT THIS ARRAY to set your real photos, captions and links.
   - image: URL of your photo (host it anywhere — your own site,
     an image host, etc). Leave the gradient placeholders only
     for testing.
   - link: where the click on the photo should send visitors —
     this is your backlink target.
   ============================================================ */
const POSTS = [
  {
    name: "Your Name",
    role: "Photography",
    avatar: "",
    caption: "A quiet street in the old quarter, shot just after sunrise.",
    tags: "#streetphotography #film",
    link: "https://example.com",
    gradient: "linear-gradient(160deg, #2b2420 0%, #6b4a2f 55%, #d9a441 100%)"
  },
  {
    name: "Your Name",
    role: "Photography",
    avatar: "",
    caption: "Coastline near the old lighthouse, late in the day.",
    tags: "#coast #longexposure",
    link: "https://example.com",
    gradient: "linear-gradient(160deg, #101820 0%, #1f3b4d 55%, #6ea8bf 100%)"
  },
  {
    name: "Your Name",
    role: "Photography",
    avatar: "",
    caption: "Still life, morning light through the kitchen window.",
    tags: "#stilllife #naturallight",
    link: "https://example.com",
    gradient: "linear-gradient(160deg, #241b16 0%, #5c3a2e 55%, #c98a5b 100%)"
  },
  {
    name: "Your Name",
    role: "Photography",
    avatar: "",
    caption: "Portrait series, shot on location in the studio's back room.",
    tags: "#portrait #studio",
    link: "https://example.com",
    gradient: "linear-gradient(160deg, #1a1512 0%, #3d2f28 55%, #b08968 100%)"
  }
];

const feed = document.getElementById('feed');
const dotsWrap = document.getElementById('dots');

function heartIcon(){
  return `<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.35-9.5-9C.8 7.2 3 3.5 6.5 3.5c2 0 3.5 1.2 4.3 2.6.8-1.4 2.3-2.6 4.3-2.6C18.6 3.5 20.8 7.2 21 11c-2.5 4.65-9.5 9-9.5 9z"/></svg>`;
}
function commentIcon(){
  return `<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 1 1-3.4-6.5L21 4l-1 4.5A7.9 7.9 0 0 1 21 12z"/></svg>`;
}
function shareIcon(){
  return `<svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>`;
}
function visitIcon(){
  return `<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M9 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></svg>`;
}

POSTS.forEach((post, i) => {
  const card = document.createElement('section');
  card.className = 'card';
  card.style.backgroundImage = post.image ? `url('${post.image}')` : post.gradient;
  card.dataset.index = i;

  card.innerHTML = `
    <div class="card-clickable" data-link="${post.link}"></div>
    <div class="rail">
      <button class="rail-btn like-btn" data-count="0">
        ${heartIcon()}
        <span class="like-count">0</span>
      </button>
      <button class="rail-btn">
        ${commentIcon()}
        <span>Reply</span>
      </button>
      <button class="rail-btn">
        ${shareIcon()}
        <span>Share</span>
      </button>
      <button class="rail-btn visit" data-link="${post.link}">
        ${visitIcon()}
        <span>Visit</span>
      </button>
    </div>
    <div class="content">
      <div class="identity">
        <div class="avatar" style="${post.avatar ? `background-image:url('${post.avatar}')` : ''}"></div>
        <div>
          <div class="handle">${post.name}</div>
          <div class="role">${post.role}</div>
        </div>
      </div>
      <div class="caption">${post.caption}</div>
      <div class="tags">${post.tags}</div>
    </div>
  `;

  feed.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dotsWrap.appendChild(dot);
});

// Click on the photo itself -> go to that post's link
feed.addEventListener('click', (e) => {
  const clickable = e.target.closest('.card-clickable, .visit');
  if (clickable && clickable.dataset.link) {
    window.open(clickable.dataset.link, '_blank', 'noopener');
  }
});

// Like button toggle
feed.addEventListener('click', (e) => {
  const likeBtn = e.target.closest('.like-btn');
  if (!likeBtn) return;
  const countEl = likeBtn.querySelector('.like-count');
  const liked = likeBtn.classList.toggle('liked');
  let count = parseInt(likeBtn.dataset.count, 10);
  count = liked ? count + 1 : count - 1;
  likeBtn.dataset.count = count;
  countEl.textContent = count;
});

// Dot indicator follows scroll position
const cards = document.querySelectorAll('.card');
const dots = document.querySelectorAll('.dot');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const idx = [...cards].indexOf(entry.target);
      dots.forEach(d => d.classList.remove('active'));
      dots[idx].classList.add('active');
    }
  });
}, { root: feed, threshold: 0.6 });
cards.forEach(c => observer.observe(c));

// Upload: replaces the currently visible card's photo (client-side preview only —
// for a live site, host the file somewhere and put its URL in POSTS[].image instead)
const fileInput = document.getElementById('file-input');
document.getElementById('upload-trigger').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const activeDotIdx = [...dots].findIndex(d => d.classList.contains('active'));
    const targetCard = cards[activeDotIdx] || cards[0];
    targetCard.style.backgroundImage = `url('${ev.target.result}')`;
  };
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
